name: Build and attach release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag whose source should be built and uploaded
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    name: Build signed universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # apksigner from build-tools 35+ cannot currently be verified by
      # F-Droid's reproducible-build signature copier. Keep this pinned.
      - name: Install reproducible signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing repository secret for ${variable}."
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Align and sign universal APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          RELEASE_TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          SAFE_TAG="$(printf '%s' "$RELEASE_TAG" | tr '/ ' '--')"
          APK_NAME="datamosh-${SAFE_TAG}-universal.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_NAME" \
            "$RUNNER_TEMP/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Verify packaged architectures
        run: |
          if unzip -l "$APK_NAME" | grep -qE 'lib/[^/]+/.*\.so$'; then
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              if ! unzip -l "$APK_NAME" | grep -q "lib/$abi/"; then
                echo "::error::The APK does not contain native libraries for $abi."
                exit 1
              fi
            done
          else
            echo "No native libraries are bundled; this APK is architecture-neutral."
          fi

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
